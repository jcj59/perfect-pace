<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Elevation-aware pacing plans for any course." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Perfect Pace</title>
    <script>
      // Apply the theme before first paint (the app keeps it in sync after). Mirrors src/theme.ts.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("pp:theme");
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

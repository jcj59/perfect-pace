<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Elevation-aware pacing plans for any course." />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1918" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Perfect Pace" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Perfect Pace</title>
    <script>
      // Apply the theme before first paint (the app keeps it in sync after). Mirrors src/theme.ts.
      // The theme-color metas must come before this script.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("pp:theme");
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        if (pref === "dark" || pref === "light") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].content = dark ? "#1a1918" : "#f3f1ec";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Nightly

# Daily: the live smoke suite against production (real network services). Weekly (Mondays) and
# on a manual run: the full E2E suite on Firefox and WebKit too, on 4 shards (every PR already
# runs it on Chromium). Opens an issue when anything fails.

on:
  schedule:
    - cron: "17 7 * * *"
    # Keep in sync with the cross-browser job's `if`.
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      cross_browser:
        description: Run the Firefox and WebKit suite too
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

env:
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"
  PRODUCTION_URL: https://perfect-pace.hf-worker.workers.dev

jobs:
  live-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Live routing key present
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          if [ -z "$ORS_API_KEY" ]; then
            echo "::warning::ORS_API_KEY is not set: the live routing test (routing @live) is skipped."
          fi
      - name: "@smoke and @live against production"
        env:
          PP_BASE_URL: ${{ env.PRODUCTION_URL }}
          # The live routing test runs only when the key exists; it calls production's /api/route,
          # which holds the key as a Worker secret (uploaded by the Deploy workflow).
          PP_ORS_KEY_SET: ${{ secrets.ORS_API_KEY != '' && '1' || '' }}
        run: pnpm e2e --grep "@smoke|@live"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-live-smoke
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14

  # Firefox and WebKit only: the Chromium projects are what every PR's full run covers.
  cross-browser:
    name: cross-browser ${{ matrix.shard }}/${{ strategy.job-total }}
    if: (github.event_name == 'workflow_dispatch' && inputs.cross_browser) || github.event.schedule == '17 8 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      # Firefox refuses to run as root with a HOME owned by another user.
      HOME: /root
      PP_BROWSERS: all
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Headless Firefox only gets WebGL (for the map) from an X display: under Xvfb it draws with
      # Mesa's software renderer. Without one the map is "unavailable" and every test fails.
      - name: Full E2E on Firefox and WebKit (local wrangler dev)
        run: xvfb-run --auto-servernum pnpm e2e --project desktop-firefox --project desktop-webkit --project iphone-webkit --shard "$SHARD"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-cross-browser-${{ matrix.shard }}
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14

  report:
    needs: [live-smoke, cross-browser]
    # A job that hits its timeout ends cancelled, not failed, and needs an issue too.
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Nightly run failed ($(date -u +%F))" --body "Live smoke or cross-browser E2E failed. Run: $RUN_URL"

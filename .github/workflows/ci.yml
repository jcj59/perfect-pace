name: CI

# Every PR gets one of three kinds of run (decided by the `changes` job):
# - quick (every push by default): verify, perf, preview, and the desktop E2E project on 3 shards.
#   The required `e2e` and `lighthouse` checks are NOT reported (their jobs get other names), so
#   branch protection keeps the PR unmergeable until a full run passes on the head commit.
# - full: verify, perf, preview, every E2E project (desktop, iPhone, Pixel) on 8 shards, the
#   timing budgets (`e2e-perf`) and Lighthouse; the `e2e` job gathers them into the required
#   check. Runs when the PR has the `full-ci` label (adding it dispatches a run, see ci-full.yml),
#   when it is marked ready for review, and on a manual run.
# - docs: only documentation changed. verify runs; the rest is skipped and `e2e` passes.
# Required checks on main: verify, perf, preview, e2e, lighthouse. See CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (for the preview alias and to supersede that PR's runs)
        type: string
        default: ""

concurrency:
  # One run per PR at a time: a new push (or a full run dispatched for it) cancels the older one.
  group: ci-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - name: Worker types are current
        run: pnpm --filter @pp/worker exec wrangler types --check
      - run: pnpm typecheck
      - name: Unit, golden and Worker integration tests (with the core coverage floor)
        run: pnpm test
      - run: pnpm build

  perf:
    needs: changes
    if: needs.changes.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Benchmarks within budget
        run: pnpm perf

  # Picks the kind of run (see the top of this file): `mode` is docs, quick or full, plus the
  # Playwright projects and shard list the `e2e-shard` matrix uses for it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      projects: ${{ steps.mode.outputs.projects }}
      shards: ${{ steps.mode.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The PR merge commit and its first parent (the base branch), to diff the two.
          fetch-depth: 2
      - id: mode
        env:
          ACTION: ${{ github.event.action }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          mode=quick
          why="a push without the full-ci label"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            mode=full why="a manual (or full-ci label) run"
          else
            git diff --name-only HEAD^1 HEAD | tee changed.txt
            if [ -s changed.txt ] && ! grep -qvE '^(docs/.+|[^/]+\.md)$' changed.txt; then
              mode=docs why="only documentation changed"
            elif [ "$FULL_LABEL" = true ]; then
              mode=full why="the PR has the full-ci label"
            elif [ "$ACTION" = ready_for_review ]; then
              mode=full why="the PR was marked ready for review"
            fi
          fi
          if [ "$mode" = full ]; then
            projects="--project desktop --project iphone --project pixel"
            shards="[1, 2, 3, 4, 5, 6, 7, 8]"
          else
            projects="--project desktop"
            shards="[1, 2, 3]"
          fi
          {
            echo "mode=$mode"
            echo "projects=$projects"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"
          echo "### $mode run: $why" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mode" = quick ]; then
            {
              echo
              echo "Desktop E2E only. The required \`e2e\` and \`lighthouse\` checks report only from a full run."
              echo "Add the \`full-ci\` label (\`gh pr edit ${PR:-<n>} --add-label full-ci\`) when the PR is ready."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  preview:
    needs: changes
    if: needs.changes.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      version: ${{ steps.deploy.outputs.version }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare credentials present
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: no preview deploy. E2E will run against local wrangler dev."
            echo "### Preview skipped (no Cloudflare credentials)" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: ./.github/actions/setup
        if: steps.creds.outputs.ok == 'true'
      - run: pnpm build
        if: steps.creds.outputs.ok == 'true'
      - name: Upload a preview version
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          ALIAS: pr-${{ github.event.pull_request.number || inputs.pr || 'manual' }}
        run: |
          cd apps/worker
          pnpm exec wrangler versions upload --preview-alias "$ALIAS" --message "$ALIAS ${GITHUB_SHA::7}" | tee upload.log
          version=$(sed -n 's/^Worker Version ID: *//p' upload.log)
          url=$(sed -n 's/^Version Preview URL: *//p' upload.log)
          alias_url=$(sed -n 's/^Version Preview Alias URL: *//p' upload.log)
          if [ -z "$version" ] || [ -z "$url" ]; then echo "::error::Could not parse the preview upload output"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployed"
            echo "- This commit: $url"
            echo "- Latest for this PR: $alias_url"
            echo "- Version: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A full run: the desktop, iPhone and Pixel projects on 8 shards. A quick run: desktop only, on
  # 3. Split evenly by test count. Each shard is a full Playwright run on its own runner, in the
  # same image `pnpm visual:update` uses, so screenshots match the committed baselines.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [changes, preview]
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'quick'
    runs-on: ubuntu-latest
    # A shard takes 3 to 5 minutes; the headroom covers a slow runner and the suite growing until
    # the shard count is raised (see CONTRIBUTING.md).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      PP_BASE_URL: ${{ needs.preview.outputs.url }}
      PP_EXPECT_VERSION: ${{ needs.preview.outputs.version }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      PROJECTS: ${{ needs.changes.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build for local wrangler dev (no preview URL)
        if: env.PP_BASE_URL == ''
        run: pnpm build
      - name: E2E, visual and axe
        env:
          PP_BLOB_REPORT: "1"
        run: pnpm e2e $PROJECTS --shard "$SHARD"
      - name: Quarantined tests (non-blocking)
        continue-on-error: true
        env:
          PP_QUARANTINE: "1"
        run: pnpm e2e $PROJECTS --shard "$SHARD" --pass-with-no-tests --reporter=list
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: blob-report-${{ matrix.shard }}
          # A rerun of failed jobs replaces their reports, so the merged report stays complete.
          overwrite: true
          path: e2e/blob-report
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: e2e/test-results
          retention-days: 14

  # The timing budgets that must not share the CPU, on a runner of their own, one at a time.
  # Full runs only.
  e2e-perf:
    needs: [changes, preview]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      PP_BASE_URL: ${{ needs.preview.outputs.url }}
      PP_EXPECT_VERSION: ${{ needs.preview.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build for local wrangler dev (no preview URL)
        if: env.PP_BASE_URL == ''
        run: pnpm build
      # Hosted runners vary in CPU, and the budgets track it; the model explains a slow run.
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo; nproc
      - name: Load and plan budgets, alone
        env:
          PP_BLOB_REPORT: "1"
        run: pnpm e2e --project load-perf --project plan-perf --no-deps --workers 1
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: blob-report-perf
          # A rerun of failed jobs replaces their reports, so the merged report stays complete.
          overwrite: true
          path: e2e/blob-report
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-perf-${{ github.run_attempt }}
          path: e2e/test-results
          retention-days: 14

  # The required check, reported only by a full or docs run. In a full run it passes only when
  # every shard, the timing budgets and Lighthouse passed; in a docs run, when `changes` did. In a
  # quick run this job is named `e2e (quick)` instead and reports the desktop subset, so the
  # required `e2e` stays "expected" (merge blocked) until a full run passes on the head commit.
  e2e:
    name: ${{ needs.changes.outputs.mode == 'quick' && 'e2e (quick)' || 'e2e' }}
    needs: [changes, preview, e2e-shard, e2e-perf, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every E2E job passed
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CHANGES: ${{ needs.changes.result }}
          PREVIEW: ${{ needs.preview.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
          PERF: ${{ needs.e2e-perf.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          echo "mode=$MODE changes=$CHANGES preview=$PREVIEW e2e-shard=$SHARDS e2e-perf=$PERF lighthouse=$LIGHTHOUSE"
          [ "$CHANGES" = success ] || exit 1
          case "$MODE" in
            docs)
              echo "Only documentation changed: E2E skipped."
              ;;
            full)
              [ "$PREVIEW" = success ] && [ "$SHARDS" = success ] && [ "$PERF" = success ] && [ "$LIGHTHOUSE" = success ]
              ;;
            quick)
              [ "$PREVIEW" = success ] && [ "$SHARDS" = success ] || exit 1
              msg="Desktop E2E subset passed. This is not the required e2e check: it reports only from a full run. Add the full-ci label (gh pr edit ${PR:-<n>} --add-label full-ci) to run the full suite on this commit."
              echo "::notice title=Full run needed before merge::$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit 1 ;;
          esac

  # One HTML report for the whole run, merged from every shard's blob report. Not a required
  # check: it only packages what the shards already decided. Every full run; a quick run only
  # when something failed.
  e2e-report:
    needs: [changes, e2e-shard, e2e-perf]
    if: >-
      always() && (needs.changes.outputs.mode == 'full' ||
      (needs.changes.outputs.mode == 'quick' && needs.e2e-shard.result == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: Merge into one HTML report
        run: pnpm --dir e2e exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: e2e/playwright-report
          retention-days: 14

  # Lighthouse accessibility (at least 95, phone and desktop) against the preview. Installability
  # and the service worker are asserted in the E2E suite (e2e/tests/pwa.spec.ts). Full runs only;
  # in a quick run it is skipped under another name, so the required `lighthouse` stays expected.
  lighthouse:
    name: ${{ needs.changes.outputs.mode == 'quick' && 'lighthouse (full run only)' || 'lighthouse' }}
    needs: [changes, preview]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      PP_BASE_URL: ${{ needs.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build for local wrangler dev (no preview URL)
        if: env.PP_BASE_URL == ''
        run: pnpm build
      - name: Accessibility score
        run: pnpm lighthouse
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: lighthouse-${{ github.run_attempt }}
          path: e2e/lighthouse-report
          retention-days: 14

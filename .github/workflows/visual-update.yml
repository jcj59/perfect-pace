name: Visual baselines

# Regenerates Playwright screenshot baselines in the Linux Playwright container and uploads
# them as the `visual-baselines` artifact. Triggered by adding the `visual-update` label to a PR
# (works before the workflow is on main) or by hand. `pnpm visual:update --ci` does the
# labeling, waits, and downloads the result; commit it with a reason in the PR description.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # One runner per project, in parallel; `merge` combines their baselines into one artifact.
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'visual-update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        project: [desktop, iphone, pixel]
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR head, not the merge commit, so the baselines match the branch being committed to.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Regenerate every ${{ matrix.project }} baseline
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          rm -rf "e2e/tests/__screenshots__/$PROJECT"
          pnpm e2e --project "$PROJECT" --grep @visual --update-snapshots=all
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-${{ matrix.project }}
          path: e2e/tests/__screenshots__/${{ matrix.project }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: visual-baselines-*
          path: shots
      - name: One directory per project
        run: for dir in shots/visual-baselines-*; do mv "$dir" "shots/${dir#shots/visual-baselines-}"; done
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: shots
          if-no-files-found: error
          retention-days: 7
